name: Feature request
description: Suggest a change or a new option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the use case first. What does your app need that the component cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: An API sketch, a screenshot from another app, or a short description.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you tried
